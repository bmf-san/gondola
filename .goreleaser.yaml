version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...

project_name: gondola

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm
      - arm64
    ignore:
      # 32-bit arm is not a valid target for these platforms.
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
    main: ./cmd/main.go

dockers_v2:
  - images:
      - bmfsan/gondola
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      # gcr.io/distroless/static-debian12 (the base image) publishes amd64
      # and arm64 only, so the Docker image targets just those. 32-bit arm
      # users can still use the linux_armv6 archive from the release.
      - linux/amd64
      - linux/arm64
    # SBOM/provenance attestations are disabled to keep parity with the
    # previous setup; enable later if desired.
    sbom: false

archives:
  - formats: [ tar.gz ]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [ zip ]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"