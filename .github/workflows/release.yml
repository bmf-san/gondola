name: GoReleaser

on:
  push:
    tags:
      - '*'
  # Invoked by release-please.yml right after it creates a release tag. A
  # tag pushed by GITHUB_TOKEN cannot trigger the `push: tags` event above,
  # so release-please calls this workflow directly. Also usable on its own
  # to rebuild an existing tag without re-tagging.
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag to build and release (e.g. 2.0.0).'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build and release (e.g. 2.0.0).'
        required: true
        type: string

# Default the workflow token to no permissions and grant exactly what
# GoReleaser needs at the job level. Satisfies the Scorecard Token-Permissions check.
permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        go-version: [ 'stable' ]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.0
        with:
          fetch-depth: 0
          # For tag pushes, github.ref already points at the tag. When
          # invoked via workflow_call/workflow_dispatch, check out the
          # requested tag so GoReleaser sees the correct version.
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}